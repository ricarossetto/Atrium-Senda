<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6A3"/>
      <stop offset="35%" stop-color="#C8A24B"/>
      <stop offset="100%" stop-color="#8C7322"/>
    </linearGradient>
    <linearGradient id="emblemGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="100%" stop-color="#E5C794"/>
    </linearGradient>
  </defs>

  <g transform="translate(12, 10)">
    <!-- Pedimento Triangular -->
    <path d="M48 6 L90 66 L75 66 L48 24 L21 66 L6 66 Z" fill="url(#emblemGoldGrad)"/>
    
    <!-- Coluna Esquerda -->
    <rect x="13" y="68" width="17" height="4.5" rx="1.5" fill="url(#emblemGoldGrad)"/>
    <rect x="15.5" y="72.5" width="4" height="25" fill="url(#emblemGoldGrad)"/>
    <rect x="23.5" y="72.5" width="4" height="25" fill="url(#emblemGoldGrad)"/>
    <rect x="11" y="97.5" width="21" height="4.5" rx="1.5" fill="url(#emblemGoldGrad)"/>

    <!-- Coluna Direita -->
    <rect x="66" y="68" width="17" height="4.5" rx="1.5" fill="url(#emblemGoldGrad)"/>
    <rect x="68.5" y="72.5" width="4" height="25" fill="url(#emblemGoldGrad)"/>
    <rect x="76.5" y="72.5" width="4" height="25" fill="url(#emblemGoldGrad)"/>
    <rect x="64" y="97.5" width="21" height="4.5" rx="1.5" fill="url(#emblemGoldGrad)"/>

    <!-- Circuitos Internos -->
    <!-- Circuito Central -->
    <path d="M48 30 L48 97.5" stroke="url(#emblemGoldLight)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="48" cy="27" r="5" fill="url(#emblemGoldLight)"/>

    <!-- Circuito Esquerdo -->
    <path d="M37 50 L43.5 60 L43.5 97.5" stroke="url(#emblemGoldGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36" cy="48" r="4" fill="url(#emblemGoldGrad)"/>

    <!-- Circuito Direito -->
    <path d="M59 50 L52.5 60 L52.5 97.5" stroke="url(#emblemGoldGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="48" r="4" fill="url(#emblemGoldGrad)"/>
  </g>
</svg>
