name: Atrium Judicial CI

on:
  workflow_dispatch:

concurrency:
  group: atrium-judicial-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  judicial:
    name: Judicial Cross-Platform Suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup PNPM
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Configure pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Judicial Cross-Platform Suites
        run: |
          pnpm test:ci-judicial
        env:
          CI: true
          NODE_ENV: test
