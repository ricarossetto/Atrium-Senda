name: Atrium CI

on:
  push:
    branches: [ main, v2.0, beta-hardening, master ]
  pull_request:
    branches: [ main, v2.0, beta-hardening, master ]

jobs:
  test:
    name: Lint, Test & E2E Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Setup PNPM
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: |
          npm ci || npm install --no-audit --no-fund

      - name: Install Playwright Browsers (Chromium)
        run: |
          npx playwright install chromium --with-deps

      - name: Run Integrity Syntax Checks
        run: |
          npm run check

      - name: Run Full Audit & Test Suite (12 Suites)
        run: |
          npm test
        env:
          CI: true
          NODE_ENV: test

      - name: Run Multi-Viewport Visual QA
        run: |
          node tests/visual-qa.mjs
        env:
          CI: true
          NODE_ENV: test

      - name: Upload Visual QA Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atrium-visual-qa-screenshots
          path: artifacts/visual-qa/
          retention-days: 14

  judicial-a1-windows:
    name: Judicial A1 Windows Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm ci || npm install --no-audit --no-fund
        shell: bash

      - name: Install Playwright Browsers (Chromium)
        run: |
          npx playwright install chromium
        shell: bash

      - name: Run Full A1 Sandbox & Judicial Suite on Windows
        run: |
          node tests/judicial_sandbox.mjs
        shell: bash
        env:
          CI: true
          NODE_ENV: test

