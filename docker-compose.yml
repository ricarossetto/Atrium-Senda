services:
  atrium:
    build: .
    container_name: atrium
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4173
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - JURISFLOW_CLOUD_MODE=true
      - JURISFLOW_DATA_DIR=/app/data
      - AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET:?Defina AUTH_SESSION_SECRET no arquivo .env}
      - AUTH_ENCRYPTION_KEY=${AUTH_ENCRYPTION_KEY:?Defina AUTH_ENCRYPTION_KEY no arquivo .env}
      - COLLECTOR_INGEST_TOKEN=${COLLECTOR_INGEST_TOKEN:?Defina COLLECTOR_INGEST_TOKEN no arquivo .env}
    volumes:
      - atrium-data:/app/data

volumes:
  atrium-data:
    driver: local
