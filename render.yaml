services:
  - type: web
    name: atrium-central
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: JURISFLOW_CLOUD_MODE
        value: "true"
      - key: KELLER_SKIP_COLLECTOR_ENV
        value: "true"
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: AUTH_ENCRYPTION_KEY
        generateValue: true
      - key: COLLECTOR_INGEST_TOKEN
        generateValue: true
      - key: SETUP_BOOTSTRAP_TOKEN
        generateValue: true

