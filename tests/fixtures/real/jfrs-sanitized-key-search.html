<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <title>:: eproc - Consulta Processual - Busca de Processo - Chave de Acesso ::</title>
</head>
<body class="instancia-1g">
  <div id="divInfraAreaGlobal">
    <div id="page-content-wrapper" class="infra-styles">
      <div id="divInfraAreaTela" class="infraAreaTela mt-2">
        <div id="divInfraAreaTelaD" class="container-fluid">
          <div class="bootstrap-styles" id="divInfraBarraLocalizacao">
            <div class="pl-0 pr-0 pt-1 col-md-12 justify-content-between d-flex">
              <h1>Consulta Processual - Busca de Processo - Chave de Acesso</h1>
            </div>
          </div>
          
          <form id="frmProcessoConsultaChave" method="post" action="externo_controlador.php?acao=processo_consulta_publica_chave/resultado">
            <input type="hidden" id="hdnInfraPrefixoCookie" name="hdnInfraPrefixoCookie" value="TRF4_Eproc_" />
            <input type="hidden" id="hdnInfraCaptcha" name="hdnInfraCaptcha" value="0" />
            
            <div class="form-group row">
              <label for="txtNumProcesso" class="col-sm-2 col-form-label">Número do Processo:</label>
              <div class="col-sm-4">
                <input class="form-control form-control-sm" id="txtNumProcesso" name="txtNumProcesso" pattern="[0-9]{7}-[0-9]{2}.[0-9]{4}.[0-9]{1}.[0-9]{2}.[0-9]{4}" required type="text" value="5001234-56.2024.4.04.7100" />
              </div>
            </div>

            <div class="form-group row">
              <label for="txtNumChaveDocumento" class="col-sm-2 col-form-label">Chave de Acesso:</label>
              <div class="col-sm-4">
                <input class="form-control form-control-sm" id="txtNumChaveDocumento" name="txtNumChaveDocumento" required type="number" value="987654321012" />
              </div>
            </div>

            <div class="form-group row">
              <div class="col-sm-10 offset-sm-2">
                <button type="submit" id="sbmConsultar" class="btn btn-primary btn-sm">Consultar</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
