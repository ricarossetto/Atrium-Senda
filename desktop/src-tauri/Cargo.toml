[package]
name = "atrium-senda-desktop"
version = "3.0.0"
description = "Aplicativo desktop do ATRIUM Senda para Windows"
authors = ["ATRIUM"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "atrium_senda_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
